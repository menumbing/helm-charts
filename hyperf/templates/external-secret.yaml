{{- if .Values.externalSecret }}
{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "hyperf.fullname" . }}
  labels:
    {{- include "hyperf.server.labels" . | nindent 4 }}
  {{- if .Values.argocd.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.argocd.syncWave.dependencies | quote }}
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ .Values.externalSecret.target.name | default (printf "%s-env" (include "hyperf.fullname" .)) }}
  dataFrom:
    {{- toYaml .Values.externalSecret.dataFrom | nindent 4 }}
{{- end }}
{{- end }}
